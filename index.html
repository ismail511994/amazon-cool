<style>
:root{--bg:#090d16;--card:#151d2a;--blue:#0284c7;--green:#10b981;--red:#ef4444;--txt:#f8fafc;--muted:#94a3b8;--border:#26334d}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font-family:Tajawal,Arial,sans-serif}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.app{max-width:1180px;margin:auto;padding:14px}
.top{position:sticky;top:0;z-index:5;background:#090d16ee;backdrop-filter:blur(12px);padding:10px 0}
.brand{display:flex;justify-content:space-between;align-items:center;gap:10px}
.brand h1{margin:0;font-size:22px}
.badge{padding:5px 9px;border-radius:999px;background:#10263a;color:#67e8f9;font-size:12px}
.nav{display:flex;gap:7px;overflow:auto;padding:10px 0}
.nav button,.btn{border:1px solid var(--border);background:var(--card);color:var(--txt);padding:10px 13px;border-radius:10px}
.nav button.active,.btn.primary{background:var(--blue);border-color:var(--blue)}
.btn.green{background:#075e4a;border-color:#0b8065}
.btn.red{background:#641d25;border-color:#8e2733}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--border);border-radius:15px;padding:15px;margin:12px 0}
.muted{color:var(--muted)}
.price{font-size:20px;font-weight:800;color:#67e8f9}
.field{margin:9px 0}
.field label{display:block;color:#cbd5e1;margin-bottom:5px;font-size:13px}
.field input,.field select,.field textarea{width:100%;background:#0b1220;color:var(--txt);border:1px solid var(--border);border-radius:10px;padding:11px;outline:none}
.field textarea{min-height:90px}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.hidden{display:none!important}
.notice{padding:11px;border-radius:10px;background:#171f2c;border:1px solid var(--border);margin:10px 0}
.ok{border-color:#065f46;background:#062e26}
.err{border-color:#7f1d1d;background:#351216}
.table{width:100%;border-collapse:collapse}
.table th,.table td{border-bottom:1px solid var(--border);padding:9px;text-align:right;vertical-align:top}
.search{display:flex;gap:8px}
.search input{flex:1}
.pill{display:inline-block;padding:4px 8px;border-radius:999px;background:#243147;font-size:12px}
.modal{position:fixed;inset:0;background:#0009;display:none;align-items:center;justify-content:center;z-index:20;padding:15px}
.modal.open{display:flex}
.modalbox{width:min(520px,100%);background:var(--card);border:1px solid var(--border);border-radius:16px;padding:18px;max-height:90vh;overflow:auto}
.footer{color:var(--muted);text-align:center;padding:30px;font-size:13px}
@media(max-width:600px){.app{padding:9px}.grid{grid-template-columns:1fr}.table{font-size:12px}}
</style>

function safeRead(key,fallback){
  try{
    const s=localStorage.getItem(key);
    if(!s||s==='null'||s==='undefined')return fallback;
    const parsed=JSON.parse(s);
    return parsed===null||parsed===undefined?fallback:parsed;
  }catch(e){
    console.warn('Safe read failed for:',key,e);
    return fallback;
  }
}
function safeWrite(key,val){
  try{localStorage.setItem(key,JSON.stringify(val))}
