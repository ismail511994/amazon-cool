:root{--bg:#090d16;--card:#151d2a;--blue:#0284c7;--green:#10b981;--red:#ef4444;--txt:#f8fafc;--muted:#94a3b8;--border:#26334d}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font-family:Tajawal,Arial,sans-serif}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.app{max-width:1180px;margin:auto;padding:14px}
.top{position:sticky;top:0;z-index:5;background:#090d16ee;backdrop-filter:blur(12px);padding:10px 0}
.brand{display:flex;justify-content:space-between;align-items:center;gap:10px}
.brand h1{margin:0;font-size:22px}
.badge{padding:5px 9px;border-radius:999px;background:#10263a;color:#67e8f9;font-size:12px}
.nav{display:flex;gap:7px;overflow:auto;padding:10px 0}
.nav button,.btn{border:1px solid var(--border);background:var(--card);color:var(--txt);padding:10px 13px;border-radius:10px}
.nav button.active,.btn.primary{background:var(--blue);border-color:var(--blue)}
.btn.green{background:#075e4a;border-color:#0b8065}
.btn.red{background:#641d25;border-color:#8e2733}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--border);border-radius:15px;padding:15px;margin:12px 0}
.muted{color:var(--muted)}
.price{font-size:20px;font-weight:800;color:#67e8f9}
.field{margin:9px 0}
.field label{display:block;color:#cbd5e1;margin-bottom:5px;font-size:13px}
.field input,.field select,.field textarea{width:100%;background:#0b1220;color:var(--txt);border:1px solid var(--border);border-radius:10px;padding:11px;outline:none}
.field textarea{min-height:90px}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.hidden{display:none!important}
.notice{padding:11px;border-radius:10px;background:#171f2c;border:1px solid var(--border);margin:10px 0}
.ok{border-color:#065f46;background:#062e26}
.err{border-color:#7f1d1d;background:#351216}
.table{width:100%;border-collapse:collapse}
.table th,.table td{border-bottom:1px solid var(--border);padding:9px;text-align:right;vertical-align:top}
.search{display:flex;gap:8px}
.search input{flex:1}
.pill{display:inline-block;padding:4px 8px;border-radius:999px;background:#243147;font-size:12px}
.modal{position:fixed;inset:0;background:#0009;display:none;align-items:center;justify-content:center;z-index:20;padding:15px}
.modal.open{display:flex}
.modalbox{width:min(520px,100%);background:var(--card);border:1px solid var(--border);border-radius:16px;padding:18px;max-height:90vh;overflow:auto}
.footer{color:var(--muted);text-align:center;padding:30px;font-size:13px}
@media(max-width:600px){.app{padding:9px}.grid{grid-template-columns:repeat(2,1fr);gap:8px}.table{font-size:12px}}
</style>

/* ========== AUTH ========== */
function openAuth(){document.getElementById('authModal').classList.add('open');document.getElementById('authMsg').innerHTML='';setAuthMode('login')}
function closeAuth(){document.getElementById('authModal').classList.remove('open')}
function toggleAuthMode(){setAuthMode(state.authMode==='login'?'signup':'login')}
  function saveSession(){if(state.user)safeWrite('ac_current_user',{id:state.user.id,email:state.user.email,full_name:state.profile?.full_name||state.user.full_name||'',phone:state.profile?.phone||state.user.phone||'',role:state.role||'client'})}
  function clearSession(){try{localStorage.removeItem('ac_current_user')}catch(e){}}
function setAuthMode(m){
  state.authMode=m;
  document.getElementById('authTitle').textContent=m==='login'?'تسجيل الدخول':'إنشاء حساب';
  document.getElementById('authSubmit').textContent=m==='login'?'دخول':'إنشاء الحساب';
  document.getElementById('authSwitch').textContent=m==='login'?'إنشاء حساب جديد':'لدي حساب';
  document.getElementById('nameWrap').classList.toggle('hidden',m==='login');
  document.getElementById('phoneWrap').classList.toggle('hidden',m==='login');
}

async function submitAuth(e){
  e.preventDefault();
  var email=document.getElementById('authEmail').value.trim();
  var password=document.getElementById('authPassword').value;
  var name=(document.getElementById('authName').value||'').trim();
  var phone=(document.getElementById('authPhone').value||'').trim();

  if(DEMO){
    var users=safeRead('ac_users',[]);
    if(state.authMode==='signup'){
      if(users.some(function(u){return u.email===email})){document.getElementById('authMsg').innerHTML='<div class="notice err">البريد مستخدم</div>';return}
      var isFirst=users.length===0;
      var u={id:'u'+Date.now(),email:email,password:password,full_name:name||'عميل جديد',phone:phone,role:isFirst?'admin':'client'};
      users.push(u);
      safeWrite('ac_users',users);
      state.user=u;state.profile=u;state.role=u.role;
    }else{
      var found=users.find(function(u){return u.email===email&&u.password===password});
      if(!found){document.getElementById('authMsg').innerHTML='<div class="notice err">البريد أو كلمة المرور غير صحيحة</div>';return}
      state.user=found;state.profile=found;state.role=found.role||'client';
    }
    saveSession();
    closeAuth();render();return;
  }

  var result;
  if(state.authMode==='signup'){
    result=await db.auth.signUp({email:email,password:password});
    if(result.error){document.getElementById('authMsg').innerHTML='<div class="notice err">'+esc(result.error.message)+'</div>';return}
    if(result.data.user){
      await db.from('users_profile').insert({id:result.data.user.id,full_name:name||'عميل جديد',phone:phone||null,role:'client'});
      state.user=result.data.user;state.role='client';
    }
  }else{
    result=await db.auth.signInWithPassword({email:email,password:password});

function updateDateDisplay(){
  var input=document.getElementById('bookingDate');
  var display=document.getElementById('bookingDateDisplay');
  if(!input||!display)return;
  if(!input.value){display.textContent='📅 اختار يوم';return}
  var date=new Date(input.value+'T00:00:00');
  var days=['الأحد','الإثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
  var months=['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
  var today=new Date();
  var isToday=date.toDateString()===today.toDateString();
  var tomorrow=new Date(today);tomorrow.setDate(today.getDate()+1);
  var isTomorrow=date.toDateString()===tomorrow.toDateString();
  var prefix='📅';
  if(isToday)prefix='🟢 النهاردة';
  else if(isTomorrow)prefix='🟡 بكرة';
  display.textContent=prefix+' — '+days[date.getDay()]+' '+date.getDate()+' '+months[date.getMonth()];
}

function formatArabicDate(dateStr){
  if(!dateStr)return '';
  try{
    var date=new Date(dateStr+'T00:00:00');
    var days=['الأحد','الإثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
    var months=['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
    return days[date.getDay()]+' '+date.getDate()+' '+months[date.getMonth()];
  }catch(e){return dateStr}
}

function calcPipes(){
  var hp=parseFloat(document.getElementById('pipeHP').value);
  var len=parseFloat(document.getElementById('pipeLength').value)||0;
  var units=parseInt(document.getElementById('pipeUnits').value)||1;
  var type=document.getElementById('pipeType').value;
  var result=document.getElementById('pipeResult');
  if(len<=0){result.innerHTML='<div class="notice err">اكتب الطول</div>';return}
  var base=pipePrices.perMeter[hp]||200;
  var mult=pipePrices.typeMultiplier[type]||1;
  var pipeCost=base*len*mult;
  var total=(pipeCost+pipePrices.accessories+pipePrices.installPerUnit)*units;
  var discount=0;
  if(units>=3)discount=pipePrices.discount3PlusUnits/100;
  else if(units===2)discount=pipePrices.discount2Units/100;
  var finalTotal=Math.round(total*(1-discount));
  var names={standard:'تركيب عادي',hidden:'تركيب مخفي',decor:'تركيب ديكور'};
  result.innerHTML='<div class="notice ok"><b style="color:#fbbf24">💰 التكلفة التقديرية</b><br><br>'+
    'قدرة: <b>'+hp+' حصان</b><br>'+
    'نوع: <b>'+names[type]+'</b><br>'+
    'طول: <b>'+len+' متر</b><br>'+
    'عدد: <b>'+units+'</b><br>'+
    'سعر المتر: <b>'+money(base)+'</b><br>'+
    (discount>0?'خصم: <b style="color:#10b981">-'+Math.round(discount*100)+'%</b><br>':'')+
    '<hr style="border-color:var(--border);margin:12px 0">'+
    '<div style="font-size:18px;text-align:center;color:#fbbf24;font-weight:900">الإجمالي: '+money(finalTotal)+'</div>'+
    '<p class="muted" style="font-size:11px;margin-top:8px;text-align:center">⚠️ سعر تقديري</p>'+
    '<button class="btn primary" style="margin-top:10px;background:#f59e0b;color:#111" onclick="orderPiping('+finalTotal+')">🔧 اطلب تأسيس</button></div>';
}

function calcCapacity(){
  var length=parseFloat(document.getElementById('calcLength')?.value)||0;
  var width=parseFloat(document.getElementById('calcWidth')?.value)||0;
  var height=parseFloat(document.getElementById('calcHeight')?.value)||2.7;
  var manualVol=parseFloat(document.getElementById('vol')?.value)||0;
  var result=document.getElementById('capResult');
  var volume=0,source='';
  if(length>0&&width>0){volume=length*width*height;source='المساحة: '+length+'×'+width+'×'+height+' = '+volume.toFixed(1)+' م³'}
  else if(manualVol>0){volume=manualVol;source='الحجم: '+volume+' م³'}
  else{result.innerHTML='<div class="notice err">ادخل الأبعاد أو الحجم</div>';return}
  var factor=Number(document.getElementById('factor').value);
  var btu=volume*factor;
  var hp='';
  if(btu<=15000)hp='1.5 حصان';
  else if(btu<=22500)hp='2.25 حصان';
  else if(btu<=30000)hp='3 حصان';
  else if(btu<=48000)hp='4 حصان';
  else if(btu<=60000)hp='5 حصان';
  else hp='أكثر من 5 حصان';
  result.innerHTML='<div class="notice ok">'+source+'<br>معامل: <b>'+factor+'</b><br>الحمل: <b>'+btu.toLocaleString('ar-EG')+' BTU/h</b><br>الاختيار: <b style="color:#67e8f9;font-size:18px">'+hp+'</b></div>';
}

    if(el){el.value='emergency';el.style.background='#7f1d1d';el.style.borderColor='#ef4444'}
    window.scrollTo({top:0,behavior:'smooth'});
  },150);
}

/* ========== UTILS ========== */
function toast(t){
  var x=document.createElement('div');
  x.className='notice ok';
  x.style.cssText='position:fixed;bottom:15px;left:15px;z-index:99';
  x.textContent=t;
  document.body.appendChild(x);
  setTimeout(function(){x.remove()},1800);
}
async function loadAdmin(){
  var el=document.getElementById('adminOrders');
  if(!el)return;
  var orders=safeRead('ac_orders',[]);
  if(!orders.length){el.innerHTML='<div class="muted">لا توجد طلبات</div>';return}
  el.innerHTML=orders.map(function(o,i){
    var d=o.details||{};
    var name=(d.brand||'')+' '+(d.model||'');
    var client=esc(o.client_id||'').slice(0,8);
    return '<div style="border-bottom:1px solid var(--border);padding:10px 0">'+
      '<div style="display:flex;justify-content:space-between;align-items:center">'+
        '<b>#'+String(o.id).slice(0,8)+'</b>'+
        '<span class="pill">'+esc(o.status||'pending')+'</span>'+
      '</div>'+
      '<div class="muted" style="font-size:12px;margin:4px 0">'+esc(o.service_type||'')+'</div>'+
      (name.trim()?'<div class="muted" style="font-size:12px">🔧 '+esc(name)+'</div>':'')+
      (d.phone?'<div class="muted" style="font-size:12px">📞 '+esc(d.phone)+'</div>':'')+
      (d.address?'<div class="muted" style="font-size:12px">📍 '+esc(d.address)+'</div>':'')+
      (d.bookingDate?'<div style="color:#10b981;font-size:12px">📅 '+d.bookingDate+' '+(d.bookingTime||'')+'</div>':'')+
      (d.emergency?'<div style="color:#f87171;font-size:12px">🚨 طوارئ</div>':'')+
      '<div class="actions" style="margin-top:6px">'+
        '<button class="btn" onclick="setOrderStatus('+i+',\'confirmed\')">✅ تأكيد</button>'+
        '<button class="btn" onclick="setOrderStatus('+i+',\'completed\')">✔️ إتمام</button>'+
        '<button class="btn red" onclick="setOrderStatus('+i+',\'cancelled\')">❌ إلغاء</button>'+
      '</div>'+
    '</div>';
  }).join('');
}

function setOrderStatus(i,status){
  var orders=safeRead('ac_orders',[]);
  if(!orders[i])return;
  orders[i].status=status;
  safeWrite('ac_orders',orders);
  render();
}

function postRender(){
  if(state.page==='store')filterProducts();
  if(state.page==='diagnosis')renderFaults();
  if(state.page==='orders')loadOrders();
  if(state.page==='admin')loadAdmin();
  if(state.page==='services'){
    setTimeout(function(){
      var d=document.getElementById('bookingDate');
      if(d&&!d.value){
        var t=new Date();
        var yyyy=t.getFullYear();
        var mm=String(t.getMonth()+1).padStart(2,'0');
        var dd=String(t.getDate()).padStart(2,'0');
        d.value=yyyy+'-'+mm+'-'+dd;
        d.min=yyyy+'-'+mm+'-'+dd;
        updateDateDisplay();
      }
    },50);
  }
}

function init(){
  var saved=safeRead('ac_current_user',null);
if(saved && !state.user){
  state.user={id:saved.id,email:saved.email,full_name:saved.full_name,phone:saved.phone};
  state.profile={full_name:saved.full_name,phone:saved.phone};
  state.role=saved.role||'client';
}
  render();
}

init();
</script>

if('serviceWorker' in navigator){
  window.addEventListener('load',function(){
    navigator.serviceWorker.register('service-worker.js').catch(function(){});
  });
}
